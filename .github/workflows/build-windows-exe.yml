name: Generar Instalador Windows (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Etiqueta opcional para publicar en GitHub Releases (ej. v1.0.0). Déjalo vacío para descargar desde Artifacts.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Compilar TECNOVA (.exe)
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación y generar ejecutables Windows (.exe)
        run: npm run electron:build:win

      - name: Subir ejecutables como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: TECNOVA-Windows-EXE
          path: |
            release/*.exe
            !release/*.blockmap
          if-no-files-found: error

      - name: Publicar en GitHub Releases (cuando hay etiqueta de versión)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: TECNOVA ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
